<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="d1_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="d1_accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <!-- Circular 'O' Coil Ring -->
  <circle cx="44" cy="50" r="32" fill="none" stroke="url(#d1_blue)" stroke-width="12" />
  <!-- Sharp Angled 'A' Peak interwoven with the 'O' -->
  <path d="M 44,18 L 82,82" stroke="url(#d1_accent)" stroke-width="12" stroke-linecap="round" />
  <!-- 'A' Crossbar (unrolling aluminum sheet ribbon) -->
  <path d="M 38,58 L 84,58" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
</svg>